# Include inside the HTTPS server block for the application host.
location = /substation-log {
    return 301 /substation-log/;
}

location ^~ /substation-log/ {
    # Keep headroom for rapid per-field autosaves while throttling sustained abuse.
    limit_req zone=substation_log burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18790/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}
